name: Release

# Triggered when a GitHub Release is published with a tag like v0.29.2.
# Builds the project, packs a tarball, and attaches it to the release as
# `package.tgz` — the filename the install script expects.
#
# To cut a release:
#   1. Bump "version" in package.json and commit to main.
#   2. Push a tag:  git tag v<version> && git push origin v<version>
#   3. Publish a GitHub Release targeting that tag.
#   4. This workflow runs automatically and attaches the tarball.

on:
  release:
    types: [published]

jobs:
  release:
    name: Build and attach tarball
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to upload release assets

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Pack tarball
        run: |
          npm pack
          # npm pack produces corebridge-msteams-mcp-<version>.tgz
          # rename to a fixed filename so the install script never needs updating
          mv *.tgz package.tgz

      - name: Upload tarball to release
        uses: softprops/action-gh-release@v2
        with:
          files: package.tgz
